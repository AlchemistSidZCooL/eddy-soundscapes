<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador de Onda Ampliada</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');

        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            padding: 20px;
            box-sizing: border-box;
        }

        .player-card {
            background-color: #2b2b2b;
            border-radius: 12px;
            padding: 30px;
            width: 95vw;
            max-width: 1800px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header {
            text-align: center;
            font-size: 1.5rem;
            font-weight: 600;
            color: #ccc;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .controls-row {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: #222;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: -5px;
        }

        .zoom-controls {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 1rem;
            color: #ccc;
        }
        
        .zoom-slider {
            width: 200px;
            accent-color: #00ffcc;
        }
        
        .amp-slider {
            width: 200px;
            accent-color: #ff0055;
        }

        .waveform-wrapper {
            width: 100%;
            height: 350px; 
            overflow-x: auto;
            overflow-y: auto; /* IMPORTANTE: Permite scroll vertical */
            background-color: #111;
            border-radius: 8px;
            position: relative;
            scrollbar-width: thin;
            scrollbar-color: #00ffcc #222;
        }

        .waveform-wrapper::-webkit-scrollbar {
            height: 12px;
            width: 12px;
        }
        .waveform-wrapper::-webkit-scrollbar-track {
            background: #222;
            border-radius: 4px;
        }
        .waveform-wrapper::-webkit-scrollbar-thumb {
            background: #00ffcc;
            border-radius: 4px;
        }
        .waveform-wrapper::-webkit-scrollbar-thumb:vertical {
            background: #ff0055;
        }

        .waveform-container {
            position: relative;
            width: 100%; 
            height: 330px; /* Base height, crecerá con zoom Y */
            cursor: pointer;
            min-width: 100%;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        #progress-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 0%;
            height: 100%;
            background-color: rgba(0, 255, 204, 0.15);
            border-right: 2px solid #00ffcc;
            pointer-events: none;
            mix-blend-mode: lighten;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 5px;
        }

        .time {
            font-size: 1.1rem;
            color: #aaa;
            min-width: 60px;
            text-align: center;
        }

        .play-btn {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: rgba(255,255,255,0.1);
            transition: background-color 0.2s;
        }

        .play-btn:hover {
            background-color: rgba(255,255,255,0.2);
            box-shadow: 0 0 15px rgba(0,255,204,0.3);
        }

        .play-btn svg {
            width: 30px;
            height: 30px;
            fill: currentColor;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #00ffcc;
            font-weight: 600;
            font-size: 1.2rem;
            z-index: 10;
            white-space: nowrap;
        }
    </style>
</head>
<body>

<div class="player-card">
    <div class="header" id="track-title">Billy Idol - Rebel Like You</div>
    
    <div class="controls-row">
        <div class="zoom-controls">
            <span>Zoom Horizontal (Tiempo): <strong id="zoom-x-label" style="color:#00ffcc">1x</strong></span>
            <input type="range" id="zoom-x-slider" class="zoom-slider" min="1" max="10" step="0.5" value="1">
        </div>
        
        <div class="zoom-controls">
            <span>Zoom Vertical (Picos): <strong id="zoom-y-label" style="color:#ff0055">1x</strong></span>
            <input type="range" id="zoom-y-slider" class="amp-slider" min="1" max="5" step="0.2" value="1">
        </div>
    </div>

    <!-- Contenedor Horizontal y Verticalmente Scrolleable -->
    <div class="waveform-wrapper" id="waveform-wrapper">
        <div class="waveform-container" id="waveform-container">
            <div id="loading" class="loading">Cargando y analizando audio...</div>
            <canvas id="canvas-bg"></canvas>
            <canvas id="canvas-fg"></canvas>
            <div id="progress-overlay"></div>
        </div>
    </div>
    
    <div class="controls">
        <div class="time" id="time-current">00:00</div>
        <button class="play-btn" id="play-btn">
            <svg id="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <svg id="icon-pause" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
        <div class="time" id="time-total">00:00</div>
    </div>

    <div style="text-align: center; margin-top: 5px;">
        <label for="audio-upload" style="cursor: pointer; color: #00ffcc; font-size: 1rem; border: 1px solid #00ffcc; padding: 10px 20px; border-radius: 20px; transition: all 0.3s;">
            Seleccionar otra canción
        </label>
        <input type="file" id="audio-upload" style="display: none;">
    </div>

    <audio id="audio" src="Billy Idol - Rebel Like You (Official Audio) [RBtiLJwrGCo].mp3.mpeg"></audio>
</div>

<script>
    const audio = document.getElementById('audio');
    const wrapper = document.getElementById('waveform-wrapper');
    const container = document.getElementById('waveform-container');
    const canvasBg = document.getElementById('canvas-bg');
    const canvasFg = document.getElementById('canvas-fg');
    const ctxBg = canvasBg.getContext('2d');
    const ctxFg = canvasFg.getContext('2d');
    const progressOverlay = document.getElementById('progress-overlay');
    const playBtn = document.getElementById('play-btn');
    const iconPlay = document.getElementById('icon-play');
    const iconPause = document.getElementById('icon-pause');
    const timeCurrent = document.getElementById('time-current');
    const timeTotal = document.getElementById('time-total');
    const loading = document.getElementById('loading');
    const audioUpload = document.getElementById('audio-upload');
    const titleHeader = document.getElementById('track-title');
    
    const zoomXSlider = document.getElementById('zoom-x-slider');
    const zoomXLabel = document.getElementById('zoom-x-label');
    const zoomYSlider = document.getElementById('zoom-y-slider');
    const zoomYLabel = document.getElementById('zoom-y-label');

    let audioUrl = audio.src;
    let audioBuffer = null;
    let currentZoomX = 1;
    let currentZoomY = 1;
    const baseHeight = 330;

    // Zoom Horizontal (Estira en X)
    zoomXSlider.addEventListener('input', (e) => {
        currentZoomX = parseFloat(e.target.value);
        zoomXLabel.textContent = currentZoomX.toFixed(1) + 'x';
        container.style.width = (currentZoomX * 100) + '%';
        
        if (audioBuffer) {
            resizeCanvas();
            drawWaveform(audioBuffer);
            updateProgress(); 
        }
    });

    // Zoom Vertical (Estira en Y físicamente para hacer scroll)
    zoomYSlider.addEventListener('input', (e) => {
        currentZoomY = parseFloat(e.target.value);
        zoomYLabel.textContent = currentZoomY.toFixed(1) + 'x';
        
        // Aumenta físicamente la altura del contenedor interno para forzar el scroll vertical
        container.style.height = (baseHeight * currentZoomY) + 'px';
        
        if (audioBuffer) {
            resizeCanvas();
            drawWaveform(audioBuffer);
            
            // Centra automáticamente el scroll vertical al medio del contenedor
            wrapper.scrollTop = (wrapper.scrollHeight - wrapper.clientHeight) / 2;
        }
    });

    audioUpload.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            audioUrl = URL.createObjectURL(file);
            audio.src = audioUrl;
            titleHeader.textContent = file.name;
            
            audio.pause();
            iconPlay.style.display = 'block';
            iconPause.style.display = 'none';
            progressOverlay.style.width = '0%';
            timeCurrent.textContent = "00:00";
            
            ctxBg.clearRect(0, 0, canvasBg.width, canvasBg.height);
            loading.style.display = 'block';
            loading.textContent = 'Analizando nueva onda sonora...';
            
            loadAudioAndDraw();
        }
    });

    function resizeCanvas() {
        canvasBg.width = container.offsetWidth;
        canvasBg.height = container.offsetHeight;
        canvasFg.width = container.offsetWidth;
        canvasFg.height = container.offsetHeight;
    }

    function formatTime(seconds) {
        if (isNaN(seconds)) return "00:00";
        const m = Math.floor(seconds / 60);
        const s = Math.floor(seconds % 60);
        return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }

    async function loadAudioAndDraw() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const response = await fetch(audioUrl);
            const arrayBuffer = await response.arrayBuffer();
            audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
            
            loading.style.display = 'none';
            timeTotal.textContent = formatTime(audioBuffer.duration);
            
            container.style.width = (currentZoomX * 100) + '%';
            container.style.height = (baseHeight * currentZoomY) + 'px';
            resizeCanvas();
            drawWaveform(audioBuffer);
            
            // Centrar vista
            wrapper.scrollTop = (wrapper.scrollHeight - wrapper.clientHeight) / 2;
        } catch (e) {
            loading.textContent = "Error al procesar el audio";
            console.error(e);
        }
    }

    function drawWaveform(buffer) {
        const rawData = buffer.getChannelData(0);
        
        const samples = Math.floor(canvasBg.width / 4); 
        const blockSize = Math.floor(rawData.length / samples);
        
        ctxBg.clearRect(0, 0, canvasBg.width, canvasBg.height);
        
        const barWidth = 3;
        const gap = 1;
        
        ctxBg.fillStyle = '#666666'; 

        for (let i = 0; i < samples; i++) {
            let sum = 0;
            let start = i * blockSize;
            for (let j = 0; j < blockSize; j++) {
                sum += Math.abs(rawData[start + j]);
            }
            let avg = sum / blockSize;
            
            // La altura ahora se basa directamente en la altura física del canvas ampliado
            let height = avg * canvasBg.height * 2.5; 
            
            if (height < 2) height = 2;
            
            let x = i * (barWidth + gap);
            // Dibujado desde el centro geométrico del canvas
            let y = (canvasBg.height - height) / 2;
            
            ctxBg.fillRect(x, y, barWidth, height);
        }
    }

    playBtn.addEventListener('click', () => {
        if (audio.paused) {
            audio.play();
            iconPlay.style.display = 'none';
            iconPause.style.display = 'block';
        } else {
            audio.pause();
            iconPlay.style.display = 'block';
            iconPause.style.display = 'none';
        }
    });

    function updateProgress() {
        if (!audio.duration) return;
        const percent = (audio.currentTime / audio.duration) * 100;
        progressOverlay.style.width = `${percent}%`;
        timeCurrent.textContent = formatTime(audio.currentTime);

        if (currentZoomX > 1) {
            const playheadX = (audio.currentTime / audio.duration) * container.offsetWidth;
            const viewStart = wrapper.scrollLeft;
            const viewEnd = viewStart + wrapper.offsetWidth;
            
            if (playheadX > viewEnd - 100) {
                wrapper.scrollLeft = playheadX - wrapper.offsetWidth + 100;
            } else if (playheadX < viewStart) {
                wrapper.scrollLeft = playheadX - 100;
            }
        }
    }

    audio.addEventListener('timeupdate', updateProgress);

    audio.addEventListener('ended', () => {
        iconPlay.style.display = 'block';
        iconPause.style.display = 'none';
        progressOverlay.style.width = '0%';
        wrapper.scrollLeft = 0;
        audio.currentTime = 0;
    });

    container.addEventListener('click', (e) => {
        if (!audio.duration) return;
        const rect = container.getBoundingClientRect();
        const x = e.clientX - rect.left; 
        const percent = x / container.offsetWidth;
        audio.currentTime = percent * audio.duration;
        updateProgress();
    });

    loadAudioAndDraw();
</script>
</body>
</html>
